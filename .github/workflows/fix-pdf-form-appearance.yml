name: Repair legacy PDF form fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove invalid pre-appearance font sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/member-pdfs.ts')
          s = p.read_text()
          old = '      textField.setFontSize(9.5);\n'
          if old not in s:
              print('Legacy PDF field issue already repaired.')
              raise SystemExit(0)
          p.write_text(s.replace(old, ''))
          PY
      - name: Commit repair if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/member-pdfs.ts
          git commit -m "Fix legacy fillable PDF field rendering"
          git push
